[project]
name = "mlx-lean-moe"
version = "0.1.0"
description = "Memory-lean MoE LLM inference on Apple Silicon, built on mlx.core: streams only router-selected expert weights from disk instead of loading the whole model."
readme = "README.md"
authors = [
    { name = "Nikita Lopanov", email = "lopanovnikita0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.29.0",
    "mlx>=0.32.2",
    "numpy>=2.5.2",
    "safetensors>=0.8.0",
    "transformers>=5.16.1",
]

[project.scripts]
mlx-lean-moe = "mlx_lean_moe.server:_main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlx-lm>=0.31.3",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "R"]
